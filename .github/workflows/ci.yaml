name: CI

# Lint and unit tests only. The tests need a few packages, so CI installs those instead of
# restoring the full renv lockfile (Stan, plotting and logo packages need system libraries that
# the analysis uses but the tests do not).

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true

      - name: Install test dependencies
        run: |
          install.packages(c("testthat", "lintr", "dplyr", "tibble", "purrr", "withr", "here"))
        shell: Rscript {0}

      - name: Lint
        run: |
          lints <- lintr::lint_dir("R")
          print(lints)
          if (length(lints) > 0) quit(status = 1)
        shell: Rscript {0}

      - name: Test
        run: testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
        shell: Rscript {0}
